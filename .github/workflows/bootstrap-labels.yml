name: Bootstrap workflow labels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  labels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure SuperMail labels exist
        run: |
          gh label create roadmap-ready --color 1d76db --description "Issue is ready for dependency-aware dispatch" --force --repo "$GH_REPO"
          gh label create claimed --color 7057ff --description "Issue has an active dispatcher claim" --force --repo "$GH_REPO"
          gh label create in-progress --color 5319e7 --description "Jules is implementing this issue" --force --repo "$GH_REPO"
          gh label create ai-review --color 0e8a16 --description "PR is awaiting automated AI review" --force --repo "$GH_REPO"
          gh label create ai-approved --color 2da44e --description "AI review passed for current head SHA" --force --repo "$GH_REPO"
          gh label create needs-changes --color d73a4a --description "AI review found required changes" --force --repo "$GH_REPO"
          gh label create escalated --color b60205 --description "Human or higher-level review is required" --force --repo "$GH_REPO"
          gh label create security --color b60205 --description "Security-sensitive change" --force --repo "$GH_REPO"
          gh label create gmail --color 0366d6 --description "Gmail integration" --force --repo "$GH_REPO"
          gh label create dispatcher --color 5319e7 --description "Development dispatcher" --force --repo "$GH_REPO"
          gh label create jules --color 1d76db --description "Jules implementation" --force --repo "$GH_REPO"
